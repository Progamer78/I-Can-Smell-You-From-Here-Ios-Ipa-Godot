name: Export and Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  export-and-build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Godot Engine
      uses: chickensoft-games/setup-godot@v2
      with:
        version: '4.7' # Corrected input name
        use-dotnet: false
        include-templates: true # Automatically downloads iOS export templates

    - name: Export Xcode Project from Godot
      run: |
        mkdir -p build/ios
        godot --headless --export-release "iOS" build/ios/game.xcodeproj

    - name: Build Xcode Archive (Unsigned)
      run: |
        xcodebuild archive \
          -project "build/ios/game.xcodeproj" \
          -scheme "iOS" \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/ios/game.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into .IPA
      run: |
        mkdir -p Payload
        cp -r build/ios/game.xcarchive/Products/Applications/*.app Payload/
        zip -r game.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-IPA
        path: game.ipa
